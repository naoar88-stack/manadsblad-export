services:
  - type: web
    name: manadsblad-export
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://manadsblad.vercel.app
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
